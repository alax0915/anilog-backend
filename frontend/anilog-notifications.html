<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="./logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANILOG - Notifications</title>

  <!-- Google Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --bg: #05060c;
      --panel: #090b13;
      --panel2: #0d0f18;
      --panel3: #11131d;
      --border: #25283a;
      --purple: #9d2cff;
      --purple2: #c34cff;
      --text: #f5f3f8;
      --muted: #8f8d9d;
      --dim: #676675;
      --danger: #ff2d63;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #03040a;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    img {
      display: block;
      object-fit: cover;
    }

    /* PRELOADER */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #05050b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(157, 44, 255, 0.2);
      border-top-color: var(--purple2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .page-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
    }

    body.loaded .page-wrapper {
      opacity: 1;
      visibility: visible;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* LAYOUT STRUCTURE */
    .page-wrapper {
      min-height: 100vh;
      padding: 40px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .desktop-shell {
      position: relative;
      width: min(1510px, 100%);
      min-height: 935px;
      display: block; /* Updated since sidebar is removed */
      background:
        radial-gradient(circle at 73% 20%, rgba(102, 20, 173, .16), transparent 28%),
        linear-gradient(115deg, #090a12, #060810 58%, #080711);
      border: 1px solid #272936;
      border-radius: 9px;
      overflow: visible;
      box-shadow: 0 0 0 1px #25183b, 0 25px 70px rgba(0, 0, 0, .62);
      backdrop-filter: blur(20px);
    }

    .desktop-shell::before {
      content: "";
      position: absolute;
      inset: 7px;
      pointer-events: none;
      z-index: 30;
      border: 1px solid rgba(156, 47, 244, .48);
      clip-path: polygon(0 0, 2% 0, 2.4% 1.5%, 98% 1.5%, 100% 0, 100% 98%, 98.4% 100%, 2% 100%, 0 98%);
    }

    /* BACK BUTTON CONTAINER */
    .back-btn-container {
      padding: 24px 24px 0 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--panel2);
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      border-color: var(--purple2);
      background: rgba(157, 44, 255, 0.15);
    }

    /* MAIN CONTENT */
    .main {
      min-width: 0;
      padding: 0 24px 45px;
    }

    .topbar {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(31, 34, 47, .65);
    }

    .page-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
    }

    .notif-count-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      background: var(--purple);
      color: #fff;
      transition: all 0.3s ease;
    }

    .top-actions-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 6px;
      background: var(--panel2);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .top-actions-btn:hover:not(:disabled) {
      border-color: var(--purple2);
      background: rgba(157, 44, 255, 0.15);
    }

    .top-actions-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: var(--border);
      background: var(--panel);
    }

    /* NOTIFICATIONS FILTER & LIST */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin: 24px 0 16px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: rgba(157, 44, 255, 0.2);
      border-color: var(--purple2);
      color: #fff;
    }

    .notif-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notif-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      position: relative;
    }

    .notif-card:hover {
      transform: translateX(4px);
      border-color: var(--purple2);
      background: var(--panel2);
    }

    .notif-card.unread {
      border-left: 4px solid var(--purple2);
      background: linear-gradient(90deg, rgba(157, 44, 255, 0.08), var(--panel));
    }

    .notif-poster {
      width: 50px;
      height: 68px;
      border-radius: 6px;
      flex-shrink: 0;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .notif-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notif-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notif-time {
      font-size: 11px;
      color: var(--muted);
    }

    .notif-body {
      font-size: 12px;
      color: #d1cfd8;
      line-height: 1.4;
    }

    .notif-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--purple2);
      text-transform: uppercase;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .page-wrapper {
        padding: 0 0 74px;
      }

      .desktop-shell {
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }

      .desktop-shell::before {
        display: none;
      }

      .main {
        padding: 0 14px 20px;
      }
    }
  </style>
  <script src="./anilog-auth.js"></script>
  <link rel="stylesheet" href="./anilog-theme.css">
  <script src="./anilog-theme.js" defer></script>
</head>

<body>

  <!-- PRELOADER -->
  <div id="preloader">
    <div class="spinner"></div>
  </div>

  <div class="page-wrapper">
    <main class="desktop-shell">

      <!-- BACK BUTTON -->
      <div class="back-btn-container">
        <button class="back-btn" onclick="window.history.back();">
          <span class="material-symbols-outlined">arrow_back</span> Back
        </button>
      </div>

      <!-- MAIN CONTENT -->
      <section class="main">

        <!-- TOP BAR -->
        <header class="topbar">
          <div class="page-title-wrap">
            <span class="material-symbols-outlined" style="font-size:28px; color:var(--purple2)">notifications</span>
            <h1 class="page-title">Notifications</h1>
            <span class="notif-count-badge" id="notif-badge-count">0 New</span>
          </div>
          <button class="top-actions-btn" id="btn-mark-read">
            <span class="material-symbols-outlined">done_all</span> Mark All as Read
          </button>
        </header>

        <!-- FILTER BAR -->
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="episodes">New Episodes</button>
          <button class="filter-btn" data-filter="system">System Alerts</button>
        </div>

        <!-- NOTIFICATION CONTAINER -->
        <div class="notif-container" id="notif-container">
          <!-- Rendered dynamically -->
        </div>

      </section>
    </main>
  </div>

  <script src="./anilog-notifications-page.js"></script>
</body>

</html>
