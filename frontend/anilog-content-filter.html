<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="./logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANILOG - Content Filter</title>

  <!-- Google Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --bg: #05060c;
      --panel: #090b13;
      --panel2: #0d0f18;
      --panel3: #11131d;
      --border: #25283a;
      --purple: #9d2cff;
      --purple2: #c34cff;
      --text: #f5f3f8;
      --muted: #8f8d9d;
      --dim: #676675;
      --danger: #ff2d63;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #03040a;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    img {
      display: block;
      object-fit: cover;
    }

    /* PRELOADER */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #05050b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(157, 44, 255, 0.2);
      border-top-color: var(--purple2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .page-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
    }

    body.loaded .page-wrapper {
      opacity: 1;
      visibility: visible;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* LAYOUT STRUCTURE */
    .page-wrapper {
      min-height: 100vh;
      padding: 40px 8px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .desktop-shell {
      position: relative;
      width: min(1510px, 100%);
      min-height: 935px;
      display: block;
      background:
        radial-gradient(circle at 73% 20%, rgba(102, 20, 173, .16), transparent 28%),
        linear-gradient(115deg, #090a12, #060810 58%, #080711);
      border: 1px solid #272936;
      border-radius: 9px;
      overflow: visible;
      box-shadow: 0 0 0 1px #25183b, 0 25px 70px rgba(0, 0, 0, .62);
      backdrop-filter: blur(20px);
    }

    .desktop-shell::before {
      content: "";
      position: absolute;
      inset: 7px;
      pointer-events: none;
      z-index: 30;
      border: 1px solid rgba(156, 47, 244, .48);
      clip-path: polygon(0 0, 2% 0, 2.4% 1.5%, 98% 1.5%, 100% 0, 100% 98%, 98.4% 100%, 2% 100%, 0 98%);
    }

    /* BACK BUTTON CONTAINER */
    .back-btn-container {
      padding: 24px 24px 0 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--panel2);
      border: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      border-color: var(--purple2);
      background: rgba(157, 44, 255, 0.15);
      color: var(--text);
    }

    /* MAIN SECTION */
    .main {
      min-width: 0;
      padding: 0 28px 45px;
    }

    .topbar {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(31, 34, 47, .65);
      position: relative;
      z-index: 100;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* CONTENT FILTER CARD */
    .filter-container {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 20px;
    }

    .row h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--text);
    }

    .row p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }

    /* TOGGLE SWITCH */
    .switch {
      position: relative;
      width: 48px;
      height: 26px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: #252636;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #efedf3;
      transition: 0.2s ease;
    }

    .switch input:checked+.slider {
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      border-color: var(--purple2);
    }

    .switch input:checked+.slider:before {
      transform: translateX(22px);
      background: #fff;
    }

    .status {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--purple2);
    }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 900px) {
      .page-wrapper {
        padding: 0 0 40px;
      }

      .desktop-shell {
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
        min-height: auto;
      }

      .desktop-shell::before {
        display: none;
      }

      .main {
        padding: 0 16px 20px;
      }

      .topbar {
        height: 60px;
        margin-bottom: 16px;
      }

      .page-title {
        font-size: 18px;
      }

      .row {
        flex-direction: row;
        align-items: flex-start;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- PRELOADER -->
  <div id="preloader">
    <div class="spinner"></div>
  </div>

  <div class="page-wrapper">
    <main class="desktop-shell">

      <!-- BACK BUTTON CONTAINER -->
      <div class="back-btn-container">
        <button class="back-btn" onclick="window.history.back();">
          <span class="material-symbols-outlined">arrow_back</span> Back
        </button>
      </div>

      <!-- MAIN CONTENT AREA -->
      <section class="main">

        <!-- TOP NAVIGATION BAR -->
        <header class="topbar">
          <h1 class="page-title">
            <span class="material-symbols-outlined" style="color:var(--purple2)">filter_alt</span> Content Filter
          </h1>
        </header>

        <!-- MAIN FILTER FORM -->
        <div class="filter-container">
          <section class="card">
            <div class="row">
              <div>
                <h2>18+ Content Filter</h2>
                <p>When enabled, anime rated for viewers 18 and older will be filtered out and hidden across ANILOG pages.</p>
              </div>
              <label class="switch">
                <input id="filter" type="checkbox">
                <span class="slider"></span>
              </label>
            </div>
            <div class="status" id="status">Checking filter status...</div>
          </section>
        </div>

      </section>
    </main>
  </div>

  <script>
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        preloader.style.visibility = 'hidden';
      }
      document.body.classList.add('loaded');
    });

    const profile = JSON.parse(localStorage.getItem('anilogProfile') || '{}');
    const settings = profile.settings || {};
    const filter = document.getElementById('filter');
    const status = document.getElementById('status');

    if (filter) {
      filter.checked = Boolean(settings.contentFilter);
    }

    function save() {
      const current = JSON.parse(localStorage.getItem('anilogProfile') || '{}');
      current.settings = { ...(current.settings || {}), contentFilter: filter.checked };
      localStorage.setItem('anilogProfile', JSON.stringify(current));

      if (status) {
        status.textContent = filter.checked ? '18+ anime are hidden.' : 'All content ratings may appear.';
      }
    }

    if (filter) {
      filter.addEventListener('change', save);
      save();
    }
  </script>
</body>

</html>
