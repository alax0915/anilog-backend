<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ANILOG - Preferences</title>
    <link rel="icon" href="./logo.png">
    <style>
        :root {
            --panel: #10121d;
            --line: #302342;
            --text: #f5f3f8;
            --muted: #aaa2b4;
            --accent: #b348ff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, rgba(7, 8, 17, .76), rgba(7, 8, 17, .96)), url('./pc-bg.png') center/cover fixed;
            color: var(--text);
            font-family: Arial, sans-serif
        }

        .page {
            width: min(900px, 100%);
            margin: auto;
            padding: 28px 16px
        }

        .top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px
        }

        .top img {
            width: 42px;
            height: 42px;
            object-fit: contain
        }

        .top h1 {
            font-size: 24px;
            margin: 0
        }

        .top a {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(16, 18, 29, .92);
            padding: 20px
        }

        .subtitle {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5
        }

        .questions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 22px
        }

        .question h2 {
            font-size: 13px;
            margin: 0 0 9px
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .choices label {
            padding: 8px 10px;
            border: 1px solid #3b2a4e;
            border-radius: 4px;
            color: #dcd5e3;
            font-size: 11px;
            cursor: pointer
        }

        .choices input {
            accent-color: var(--accent);
            margin-right: 5px
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px
        }

        .actions button {
            padding: 10px 16px;
            border: 1px solid var(--accent);
            border-radius: 5px;
            background: #7023a7;
            color: white;
            cursor: pointer
        }

        .status {
            color: #bb83e8;
            font-size: 11px
        }

        .recommendations {
            margin-top: 28px;
            border-top: 1px solid var(--line);
            padding-top: 18px
        }

        .recommendations h2 {
            font-size: 16px
        }

        .recommendations p {
            font-size: 12px;
            color: var(--muted)
        }

        @media(max-width:650px) {
            .page {
                padding: 18px 12px
            }

            .top h1 {
                font-size: 20px
            }

            .questions {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="top"><img src="./logo.png" alt="ANILOG">
            <h1>Preferences</h1><a href="./anilog-home.html">Back to ANILOG</a>
        </header>
        <section class="card">
            <p class="subtitle">Tell ANILOG what you enjoy. Your answers are saved on this device and used to shape
                recommendations.</p>
            <form id="preferences-form">
                <div class="questions" id="questions"></div>
                <div class="actions"><span class="status" id="status"></span><button type="submit">Save
                        Preferences</button></div>
            </form>
            <div class="recommendations" id="recommendations"></div>
        </section>
    </main>
    <script>
        const questions = [['Genres', ['Romance', 'Action', 'Adventure', 'Comedy', 'Drama', 'Fantasy', 'Horror', 'Mystery']], ['Mood', ['Lighthearted', 'Emotional', 'Dark', 'Relaxing', 'Intense']], ['Format', ['TV Series', 'Movie', 'Short Series', 'OVA']], ['Story focus', ['Character-driven', 'World-building', 'Mind games', 'Coming of age']], ['Pacing', ['Slow burn', 'Balanced', 'Fast-paced']], ['Era', ['Classic', '2000s', '2010s', 'Current']], ['Watch length', ['Short', 'Medium', 'Long']], ['Language', ['Sub', 'Dub', 'Either']], ['Release status', ['Completed', 'Currently airing', 'Upcoming']], ['Viewing time', ['Weekdays', 'Weekends', 'Any time']]]; const form = document.getElementById('preferences-form'); const saved = (JSON.parse(localStorage.getItem('anilogProfile') || '{}').settings || {}).preferences || []; document.getElementById('questions').innerHTML = questions.map(([question, choices], i) => `<div class="question"><h2>${i + 1}. ${question}</h2><div class="choices">${choices.map(choice => `<label><input type="checkbox" name="preference" value="${choice}" ${saved.includes(choice) ? 'checked' : ''}>${choice}</label>`).join('')}</div></div>`).join(''); async function showRecommendations(values) { const container = document.getElementById('recommendations'); const genres = values.filter(value => ['Romance', 'Action', 'Adventure', 'Comedy', 'Drama', 'Fantasy', 'Horror', 'Mystery'].includes(value)); const query = genres.length ? `filter[genres]=${encodeURIComponent(genres.join(','))}&` : ''; container.innerHTML = '<p>Loading recommendations...</p>'; try { const response = await fetch(`https://kitsu.io/api/edge/anime?${query}sort=-averageRating&page[limit]=6`); if (!response.ok) throw new Error('Recommendation request failed'); const json = await response.json(); const names = (json.data || []).map(anime => anime.attributes?.canonicalTitle).filter(Boolean); container.innerHTML = `<h2>Recommendations</h2><p>${names.length ? names.join(' · ') : 'No matching anime found yet.'}</p>` } catch (error) { container.innerHTML = `<h2>Recommendations</h2><p>Based on ${values.length ? values.slice(0, 4).join(', ') : 'your answers'}, recommendations will appear when the anime service is available.</p>` } } showRecommendations(saved); form.addEventListener('submit', event => { event.preventDefault(); const values = [...form.querySelectorAll('input:checked')].map(input => input.value); const profile = JSON.parse(localStorage.getItem('anilogProfile') || '{}'); profile.settings = { ...(profile.settings || {}), preferences: values }; localStorage.setItem('anilogProfile', JSON.stringify(profile)); document.getElementById('status').textContent = 'Preferences saved on this device.'; showRecommendations(values) });
    </script>
</body>

</html>
